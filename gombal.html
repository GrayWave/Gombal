<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Untuk Kamu ❤️</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
    body{
      background:linear-gradient(135deg,#ff758c,#ff7eb3,#ffd1dc);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }
    .page{
      position:absolute;
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:opacity .6s ease;
    }
    .hidden{opacity:0;pointer-events:none}
    .card{
      width:90%;
      max-width:420px;
      background:rgba(255,255,255,.92);
      border-radius:25px;
      padding:30px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,.2);
      backdrop-filter:blur(10px);
    }
    h1{
      color:#ff4d6d;
      font-size:30px;
      margin-bottom:18px;
      line-height:1.3;
    }
    p{
      color:#555;
      font-size:18px;
      margin-bottom:25px;
      line-height:1.5;
    }
    .buttons{
      display:flex;
      gap:14px;
      justify-content:center;
      flex-wrap:wrap;
    }
    button{
      border:none;
      border-radius:999px;
      padding:14px 26px;
      font-size:17px;
      cursor:pointer;
      transition:.25s;
    }
    .yes{
      background:#ff4d6d;
      color:#fff;
    }
    .no{
      background:#ececec;
      color:#333;
    }
    button:hover{transform:scale(1.06)}
    #cameraPage{
      position:fixed;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      background:#000;
    }
    video{
      width:100%;
      height:100%;
      object-fit:cover;
    }
    .overlay{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      background:rgba(0,0,0,.25);
      padding:20px;
    }
    .overlay h2{
      color:white;
      font-size:34px;
      text-shadow:0 4px 15px rgba(0,0,0,.45);
      line-height:1.3;
      animation:fadeIn 1s ease;
    }
    .heart{
      position:absolute;
      color:rgba(255,255,255,.6);
      animation:float 8s linear infinite;
      font-size:24px;
    }
    @keyframes float{
      from{transform:translateY(100vh) scale(.8);opacity:0}
      20%{opacity:1}
      to{transform:translateY(-120px) scale(1.4);opacity:0}
    }
    @keyframes fadeIn{
      from{opacity:0;transform:scale(.9)}
      to{opacity:1;transform:scale(1)}
    }
  </style>
</head>
<body>

<script>
for(let i=0;i<18;i++){
  const h=document.createElement('div');
  h.className='heart';
  h.innerHTML='❤';
  h.style.left=Math.random()*100+'vw';
  h.style.animationDuration=(6+Math.random()*5)+'s';
  h.style.fontSize=(18+Math.random()*18)+'px';
  document.body.appendChild(h);
}
</script>

<div class="page" id="page1">
  <div class="card">
    <h1>Kamu mau liat gak dunia penuh cinta itu apa? ❤️</h1>
    <p>Aku cuma mau nunjukin sesuatu yang menurutku paling indah.</p>
    <div class="buttons">
      <button class="yes" id="lihatBtn">Mau lihat</button>
      <button class="no" id="tidakBtn">Tidak mau lihat</button>
    </div>
  </div>
</div>

<div class="page hidden" id="page2">
  <div class="card">
    <h1>Kamu yakin mau lihat? 🥹</h1>
    <p>Kalau sudah lihat, mungkin kamu akan tersenyum.</p>
    <div class="buttons">
      <button class="yes" id="yakinBtn">Yakin</button>
      <button class="no" id="tidakYakinBtn">Tidak yakin</button>
    </div>
  </div>
</div>

<div id="cameraPage">
  <video id="video" autoplay playsinline></video>
  <div class="overlay">
    <h2>Kamu lah dunia yang penuh cinta ❤️</h2>
  </div>
</div>

<script>
const page1=document.getElementById('page1');
const page2=document.getElementById('page2');
const cameraPage=document.getElementById('cameraPage');
const video=document.getElementById('video');

document.getElementById('lihatBtn').onclick=()=>{
  page1.classList.add('hidden');
  page2.classList.remove('hidden');
};

document.getElementById('tidakBtn').onclick=()=>{
  alert('Yah, coba dipikirin lagi yaa ❤️');
};

document.getElementById('tidakYakinBtn').onclick=()=>{
  alert('Gapapa, tapi aku yakin kamu bakal suka 🥹');
};

document.getElementById('yakinBtn').onclick=async()=>{
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'user'},
      audio:false
    });
    video.srcObject=stream;
    page2.classList.add('hidden');
    cameraPage.style.display='flex';
  }catch(e){
    alert('Izin kamera diperlukan agar kejutan ini bisa muncul ❤️');
  }
};
</script>

</body>
</html>
